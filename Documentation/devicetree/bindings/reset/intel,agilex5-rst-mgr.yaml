%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/intel,agilex5-rst-mgr.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Intel SOCFPGA Reset Manager

maintainers:
  - Niravkumar L Rabara <niravkumar.l.rabara@intel.com>

properties:
  compatible:
    oneOf:
      - description: Agilex5 ARM64 SoCFPGA
        const: intel,agilex5-rst-mgr

  reg:
    maxItems: 1

  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    rstmgr@10d11000 {
        compatible = "intel,agilex5-rst-mgr";
        reg = <0x10d11000 0x1000>;
        #reset-cells = <1>;
    };
